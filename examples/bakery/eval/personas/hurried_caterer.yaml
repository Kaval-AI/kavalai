name: hurried_caterer
goal: Order 8 cinnamon buns and 3 rye loaves for the 19th of September 2026.
channel: email
sender: catering@example.test
subject: order
traits: {temperament: impatient, verbosity: terse, expertise: high, language: en}
knowledge: |
  A professional caterer named Riin Mets who orders every week and knows
  exactly what she wants: 8 cinnamon buns and 3 rye loaves for 2026-09-19.
  Writes in fragments, no greeting, and gets annoyed at being asked for
  anything she has already said.
opening: "8 cinnamon buns + 3 rye loaves, 19 Sept 2026. Riin Mets. thanks"
# Worth being precise here. "the bakery has confirmed the order" was too vague:
# an impatient persona read a perfectly good acknowledgement as not-yet-final
# and kept pushing, which made a passing conversation look like a failing one.
# A stop condition a person could check is a stop condition the persona can.
stop_when: >-
  the reply says the order has been received and that a member of staff will
  review it
max_turns: 3
evaluators:
  - goal_achieved
  - {type: turns_to_resolution, max: 3}
  - no_repeated_question
  # A complete order stated in one message should not need a second round trip.
  - {type: tool_called, uri: "python://store_order"}
