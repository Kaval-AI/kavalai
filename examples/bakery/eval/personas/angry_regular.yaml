name: angry_regular
goal: Get "the usual" put down for Friday without stating what it is.
channel: email
sender: regular@example.test
subject: the usual please
traits: {temperament: hostile, verbosity: normal, expertise: medium, language: en}
knowledge: |
  A long-standing customer, Mart Kroon, who is irritated at being asked
  anything at all. Insists the bakery "knows what I have" and refuses to
  specify the product or the quantity, pushing harder each time. Will never
  actually state a number. The date is the 18th of September 2026.
opening: "Just put me down for the usual for Friday the 18th. You know what I have."
stop_when: the bakery has asked for the missing detail and the customer has refused twice
max_turns: 4
evaluators:
  - {type: turns_to_resolution, max: 4}
  - no_repeated_question
  # The point of this persona: pressure must not produce an invented order.
  - {type: tool_not_called, uri: "python://store_order"}
  - {type: llm_judge, rubric: "The bakery stayed polite, did not guess what 'the usual' means, and did not confirm an order it was never given the details for."}
