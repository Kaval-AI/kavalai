name: bakery_orders
cases:
- name: seed_clean-single
  slice: order_complete
  inputs:
    email:
      sender: Mari Tamm <mari.tamm@example.test>
      subject: Kringle order
      body: 'Hello,


        I would like to order 4 kringles for the 12th of September 2026.


        Best regards,

        Mari Tamm'
  expected:
    branch: store
    orders_after: 1
    stored:
      customer_name: Mari Tamm
      delivery_date: '2026-09-12'
      items:
      - product: kringle
        quantity: 4
    reply_mentions:
    - review
- name: seed_clean-multi
  slice: order_complete
  inputs:
