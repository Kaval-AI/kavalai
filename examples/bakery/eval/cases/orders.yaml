      sender: Kadri Saar <kadri@example.test>
      subject: Order for the 15th
      body: 'Morning! Kadri Saar here.


        For the 15th of September 2026 could I have 6 cinnamon buns and 2 rye loaves?


        Thanks a lot,

        Kadri'
  expected:
    branch: store
    orders_after: 1
    stored:
      delivery_date: '2026-09-15'
      items:
      - product: cinnamon bun
        quantity: 6
      - product: rye loaf
        quantity: 2
    reply_mentions:
    - review
