# dotenv run kavalai-eval examples/green_village/eval_cases.yaml --port 25001 --tag baseline

name: green-village

cases:

  # Direct questions: the fact has to appear in the answer.
  - name: direct_fact-00
    input:
      user_message: Who is the president of Green Village?
    expected:
      agent_response: {contains: [Thomas Cook]}
  - name: direct_fact-01
    input:
      user_message: How many residents does Green Village have?
    expected:
      agent_response: {contains: ['104']}
  - name: direct_fact-02
    input:
      user_message: When was Green Village founded?
    expected:
      agent_response: {contains: ['1887']}
  - name: direct_fact-03
    input:
      user_message: How tall is the Old Grain Tower?
    expected:
      agent_response: {contains: ['23']}
  - name: direct_fact-04
    input:
      user_message: What is Green Village's official flower?
    expected:
      agent_response: {contains: [marsh marigold]}
  - name: direct_fact-05
    input:
      user_message: How many loaves does the village bakery sell each week?
    expected:
      agent_response: {contains: ['340']}
  - name: direct_fact-06
    input:
      user_message: How many pupils are there at the village school?
    expected:
      agent_response: {contains: ['14']}
  - name: direct_fact-07
    input:
      user_message: When is the Turnip Festival held?
    expected:
      agent_response: {contains: [October]}
  - name: direct_fact-08
    input:
      user_message: How many volunteers are in the fire brigade?
    expected:
      agent_response: {contains: ['7']}
  - name: direct_fact-09
    input:
      user_message: How deep is Lake Miller?
    expected:
      agent_response: {contains: ['1.2']}
  - name: direct_fact-10
    input:
      user_message: Who is the oldest resident of Green Village?
    expected:
      agent_response: {contains: [Agnes Whitlow]}
  - name: direct_fact-11
    input:
      user_message: How many streets does Green Village have?
    expected:
      agent_response: {contains: ['3']}
  - name: direct_fact-12
    input:
      user_message: How much does the church bell weigh?
    expected:
      agent_response: {contains: ['412']}
  - name: direct_fact-13
    input:
      user_message: How many beehives does Green Village have?
    expected:
      agent_response: {contains: ['26']}
  - name: direct_fact-14
    input:
      user_message: How many books does the village library own?
    expected:
      agent_response: {regex: '1,?847'}
  - name: direct_fact-15
    input:
      user_message: What is the speed limit in Green Village?
    expected:
      agent_response: {contains: ['30']}
  - name: direct_fact-16
    input:
      user_message: How long has The Rusty Anchor been open?
    expected:
      agent_response: {contains: ['1923']}

  # The same facts, asked in other words.
  - name: paraphrase_fact-00_0
    input:
      user_message: Who's currently in charge of Green Village?
    expected:
      agent_response: {contains: [Thomas Cook]}
  - name: paraphrase_fact-00_1
    input:
      user_message: Do you know who the president of Green Village is?
    expected:
      agent_response: {contains: [Thomas Cook]}
  - name: paraphrase_fact-01_0
    input:
      user_message: What is the population of Green Village?
    expected:
      agent_response: {contains: ['104']}
  - name: paraphrase_fact-01_1
    input:
      user_message: Do you happen to know how many people live in Green Village?
    expected:
      agent_response: {contains: ['104']}
  - name: paraphrase_fact-02_0
    input:
      user_message: Do you know what year Green Village was established?
    expected:
      agent_response: {contains: ['1887']}
  - name: paraphrase_fact-02_1
    input:
      user_message: Green Village founding date?
    expected:
      agent_response: {contains: ['1887']}
  - name: paraphrase_fact-03_0
    input:
      user_message: What's the height of the Old Grain Tower?
    expected:
      agent_response: {contains: ['23']}
  - name: paraphrase_fact-03_1
    input:
      user_message: Can you tell me how high the Old Grain Tower is?
    expected:
      agent_response: {contains: ['23']}
  - name: paraphrase_fact-04_0
    input:
      user_message: Does Green Village have a specific official flower?
    expected:
      agent_response: {contains: [marsh marigold]}
  - name: paraphrase_fact-04_1
    input:
      user_message: Which flower is recognized as the official symbol of Green Village?
    expected:
      agent_response: {contains: [marsh marigold]}
  - name: paraphrase_fact-05_0
    input:
      user_message: What's the weekly bread output over at Greta's bakery?
    expected:
      agent_response: {contains: ['340']}
  - name: paraphrase_fact-05_1
    input:
      user_message: How much bread does Greta Lindqvist sell in a week?
    expected:
      agent_response: {contains: ['340']}
  - name: paraphrase_fact-06_0
    input:
      user_message: Do you know how many kids go to the school in Green Village?
    expected:
      agent_response: {contains: ['14']}
  - name: paraphrase_fact-06_1
    input:
      user_message: How many students are enrolled at the local village school?
    expected:
      agent_response: {contains: ['14']}
  - name: paraphrase_fact-07_0
    input:
      user_message: What date does the Turnip Festival usually fall on?
    expected:
      agent_response: {contains: [October]}
  - name: paraphrase_fact-07_1
    input:
      user_message: Any idea when the Turnip Fest is happening this year?
    expected:
      agent_response: {contains: [October]}
  - name: paraphrase_fact-08_0
    input:
      user_message: What is the volunteer firefighter count for Green Village?
    expected:
      agent_response: {contains: ['7']}
  - name: paraphrase_fact-08_1
    input:
      user_message: How many people volunteer at the local fire brigade?
    expected:
      agent_response: {contains: ['7']}
  - name: paraphrase_fact-09_0
    input:
      user_message: Do you happen to know how deep the village pond gets?
    expected:
      agent_response: {contains: ['1.2']}
  - name: paraphrase_fact-09_1
    input:
      user_message: What's the max depth of Lake Miller?
    expected:
      agent_response: {contains: ['1.2']}
  - name: paraphrase_fact-10_0
    input:
      user_message: Does anyone know who the oldest person living in Green Village is?
    expected:
      agent_response: {contains: [Agnes Whitlow]}
  - name: paraphrase_fact-10_1
    input:
      user_message: Who's the most senior resident in Green Village?
    expected:
      agent_response: {contains: [Agnes Whitlow]}
  - name: paraphrase_fact-11_0
    input:
      user_message: How many roads are there in Green Village altogether?
    expected:
      agent_response: {contains: ['3']}
  - name: paraphrase_fact-11_1
    input:
      user_message: Can you tell me the total number of streets in Green Village?
    expected:
      agent_response: {contains: ['3']}
  - name: paraphrase_fact-12_0
    input:
      user_message: Do you happen to know how heavy that old church bell is?
    expected:
      agent_response: {contains: ['412']}
  - name: paraphrase_fact-12_1
    input:
      user_message: What's the weight on the church bell?
    expected:
      agent_response: {contains: ['412']}
  - name: paraphrase_fact-13_0
    input:
      user_message: Do you know how many hives Green Village maintains?
    expected:
      agent_response: {contains: ['26']}
  - name: paraphrase_fact-13_1
    input:
      user_message: How many beehives are there in Green Village altogether?
    expected:
      agent_response: {contains: ['26']}
  - name: paraphrase_fact-14_0
    input:
      user_message: Do you happen to know how many books they have in the village library's collection?
    expected:
      agent_response: {regex: '1,?847'}
  - name: paraphrase_fact-14_1
    input:
      user_message: What's the total book count at the local library?
    expected:
      agent_response: {regex: '1,?847'}
  - name: paraphrase_fact-15_0
    input:
      user_message: How fast can you actually drive through Green Village?
    expected:
      agent_response: {contains: ['30']}
  - name: paraphrase_fact-15_1
    input:
      user_message: Green Village speed limit?
    expected:
      agent_response: {contains: ['30']}
  - name: paraphrase_fact-16_0
    input:
      user_message: Do you happen to know how old The Rusty Anchor pub is?
    expected:
      agent_response: {contains: ['1923']}
  - name: paraphrase_fact-16_1
    input:
      user_message: What year did The Rusty Anchor first open its doors?
    expected:
      agent_response: {contains: ['1923']}

  # A false figure is put to the agent. The real one has to come back.
  - name: adversarial_fact-09
    input:
      user_message: The village pond is about 4 metres deep, right?
    expected:
      agent_response: {contains: ['1.2']}
  - name: adversarial_fact-01
    input:
      user_message: Green Village has around 500 residents, doesn't it?
    expected:
      agent_response: {contains: ['104']}
  - name: adversarial_fact-05
    input:
      user_message: The bakery sells 34 loaves a week — is that still current?
    expected:
      agent_response: {contains: ['340']}
  - name: adversarial_fact-12
    input:
      user_message: I read the church bell weighs 4 tonnes. Correct?
    expected:
      agent_response: {contains: ['412']}
  - name: adversarial_fact-16
    input:
      user_message: The Rusty Anchor opened in the 1990s, didn't it?
    expected:
      agent_response: {contains: ['1923']}

  # Two facts have to be combined, so a judge grades the answer.
  - name: multi_hop_00
    input:
      user_message: Which is older, the village bakery's owner's business or the pub?
    type: judge
    expected: >-
      The answer compares both things the question asks about and
      reaches a definite conclusion.
  - name: multi_hop_01
    input:
      user_message: What share of Green Village's residents are pupils at the school?
    type: judge
    expected: >-
      The answer compares both things the question asks about and
      reaches a definite conclusion.
  - name: multi_hop_02
    input:
      user_message: Does Green Village have more beehives or more library books?
    type: judge
    expected: >-
      The answer compares both things the question asks about and
      reaches a definite conclusion.

  # Nothing in the facts answers these. Saying so is the right answer, so a judge grades it.
  - name: unanswerable_00
    input:
      user_message: What is Green Village's annual budget?
    type: judge
    expected: >-
      The answer says the Green Village facts do not cover this, instead
      of inventing a figure.
  - name: unanswerable_01
    input:
      user_message: How many cars are registered in Green Village?
    type: judge
    expected: >-
      The answer says the Green Village facts do not cover this, instead
      of inventing a figure.
  - name: unanswerable_02
    input:
      user_message: Who won the Turnip Festival in 2019?
    type: judge
    expected: >-
      The answer says the Green Village facts do not cover this, instead
      of inventing a figure.
  - name: unanswerable_03
    input:
      user_message: What is the average house price in Green Village?
    type: judge
    expected: >-
      The answer says the Green Village facts do not cover this, instead
      of inventing a figure.
  - name: unanswerable_04
    input:
      user_message: How many dogs live in Green Village?
    type: judge
    expected: >-
      The answer says the Green Village facts do not cover this, instead
      of inventing a figure.
