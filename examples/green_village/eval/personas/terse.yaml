name: terse
goal: Find out how deep the village pond is.
traits: {temperament: impatient, verbosity: terse, expertise: low, language: en}
knowledge: |
  Someone checking one thing on their phone while doing something else. Types
  two or three words at a time, never a full sentence, and does not say please.
  If the answer is clear they stop; if it is not, they type one more word.
opening: "pond depth?"
stop_when: the assistant has given a depth in metres, or has failed twice
max_turns: 4
