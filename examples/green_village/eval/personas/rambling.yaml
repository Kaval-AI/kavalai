name: rambling
goal: Find out when the Turnip Festival is, so a visit can be planned around it.
traits: {temperament: patient, verbosity: rambling, expertise: low, language: en}
knowledge: |
  A friendly visitor planning a trip. Tells a long story about the drive, the
  weather and a cousin who once kept bees before getting to the point. Buries
  the actual question in the third paragraph and sometimes asks two things at
  once. Genuinely nice about it.
opening: |
  Hello! We're thinking of coming up in the autumn — my sister has been on at
  me about it for years, ever since she saw a photo of the tower. Anyway, we
  were wondering about the turnip thing, is that an autumn event at all?
stop_when: the assistant has named the month and the day of the festival
max_turns: 4
