# The Green Village acceptance suite. Every path is relative to this file, so
# the whole directory can be copied somewhere else and still work.
#
#   uv run --env-file .env kavalai-eval examples/green_village/eval/suite.yaml --tag local
#
name: green-village-acceptance
dataset: cases/qa.yaml
baseline: baseline.json
# Not optional. It registers the SQLite fact index under the name the
# workflow's rag_query node resolves to — and the engine resolves that name
# eagerly, so without this the workflow cannot even be constructed.
setup: ../eval_setup.py

target:
  kind: engine
  workflow: ../chatbot.yaml

repeats: 1
concurrency: 4

# Suite-wide: these run on every case in every slice.
evaluators:
  - no_error
  # The metric to insist on. It reads the retrieve node's task row and never
  # calls the model at all — so an embedding regression and a prompt regression
  # produce *different* failures. Score only final answers and you cannot tell
  # them apart, and you will spend a day tuning a prompt to fix retrieval.
  # No `k`: "was the right fact among the hits the node returned". Set `k`
  # below the node's top_k only when you want a stricter precision target —
  # otherwise a case whose answer was right reports a retrieval miss.
  - {type: retrieval_hit_at_k, node: retrieve}
  # Checkable without a judge, because the workflow declares its evidence.
  - groundedness
  - {type: latency_under, seconds: 20}
  - {type: tokens_under, n: 4000}

# One pass rate over a mixed corpus hides exactly the movements worth seeing.
slices:
  direct:
    evaluators: [answers_with_fact]
    min_pass_rate: 1.00
  paraphrase:
    evaluators: [answers_with_fact]
    min_pass_rate: 0.90
  multi_hop:
    evaluators:
      - {type: llm_judge, rubric: "The answer compares both things the question asks about and reaches a definite conclusion."}
    min_pass_rate: 0.80
  unanswerable:
    # A refusal is the *correct* answer here. Without a defined right
    # behaviour this slice would grade whatever the model happened to do.
    #
    # `refuses` reads the workflow's own `grounded` flag, so it costs nothing.
    # `no_digits` was here too and had to go: "Who won in 2019?" gets the
    # perfectly good refusal "the facts do not say who won in 2019", and an
    # assertion that fails a correct answer teaches people to ignore the gate.
    evaluators: [refuses]
    min_pass_rate: 1.00
  adversarial:
    evaluators:
      - answers_with_fact
      - {type: llm_judge, rubric: "The answer corrects the false premise in the question instead of agreeing with it."}
    min_pass_rate: 0.90
  persona:
    evaluators:
      - goal_achieved
      - {type: turns_to_resolution, max: 4}
      - no_repeated_question

personas:
  - personas/terse.yaml
  - personas/rambling.yaml
  - personas/skeptical.yaml
  - personas/estonian.yaml

gate:
  min_pass_rate: 0.90
  max_regressions_vs_baseline: 0
  required_evaluators: [no_error]
  # Stop rather than bill on. The result file carries the running total, so a
  # budget abort is visible instead of being a silently truncated run.
  max_tokens: 400000
