@if (boxes().length > 0) {
  <div class="tt" data-testid="timeline">
    <div class="tt-axis" aria-hidden="true">
      <span></span>
      <span class="tt-ticks">
        @for (tick of ticks(); track $index) {
          <span>{{ tick }}</span>
        }
      </span>
      <span></span>
    </div>
    @for (box of boxes(); track box.id) {
      <div class="tt-row" data-testid="timeline-row" [attr.data-kind]="box.kind" [title]="box.tooltip">
        <span class="tt-label" [class.nested]="box.nested">{{ box.name }}</span>
        <span class="tt-track">
          <span class="tt-bar" [attr.data-kind]="box.kind" [style.left.%]="box.left" [style.width.%]="box.width"></span>
        </span>
        <span class="tt-duration">{{ box.duration }}</span>
      </div>
    }
    <ul class="tt-legend" data-testid="timeline-legend">
      @for (entry of kinds(); track entry.kind) {
        <li><span class="tt-swatch" [attr.data-kind]="entry.kind"></span>{{ entry.label }}</li>
      }
    </ul>
  </div>
}
