[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kavalai"
version = "1.0.3"
description = "Kaval.AI is an open source Python SDK for writing AI agents and workflow automation pipelines. Suitable for conversational agents and generic workflow automation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kaval.AI Team" },
]
# Mandatory core dependencies.
#
# These are intentionally restricted to libraries that work under pyodide, so
# the lightweight core can be imported and run in the browser. Most are
# pure-Python; numpy and pydantic-core are native but ship as prebuilt pyodide
# packages. Everything that needs an unsupported native extension or a heavy
# provider SDK lives under an optional extra below.
#
# Note on async SQLAlchemy: its async engine needs ``greenlet``, which
# SQLAlchemy pulls in automatically (via a platform marker) on normal installs.
# greenlet has no pyodide build, so we deliberately do NOT list it here; under
# pyodide the IndexedDB-backed SQLite database uses SQLAlchemy's *sync* engine,
# which does not require greenlet.
dependencies = [
    "aiosqlite",
    "alembic",
    "environs",
    "httpx",
    "jinja2",
    "json-schema-to-pydantic",
    "loguru",
    "numpy",
    "partial-json-parser",
    "pydantic",
    "pyyaml",
    "rich",
    "sqlalchemy",
]

[project.optional-dependencies]
# Everything the core install leaves out: the LLM provider SDKs, embeddings and
# RAG, the PostgreSQL drivers, MCP, the REST/SSE servers and the bundled web
# tools. One extra rather than a dozen — `pip install kavalai[common]` is the
# normal, non-browser install.
#
# None of these are pyodide-compatible: they need native extensions, a
# subprocess or a real socket.
common = [
    "anthropic",
    "asyncpg",
    "authlib",
    "crawl4ai",
    "fastapi[standard]",
    "fastembed",
    "google-genai",
    "itsdangerous",
    "mcp",
    "ollama",
    "openai",
    "psycopg2-binary",
    "scikit-learn",
    "sqliteai-vector",
]

# The browser counterpart of `common`: what the core install additionally needs
# to run under Pyodide / WebLLM, where inference, storage and embeddings are all
# provided by the page. `pyodide-http` routes httpx through the browser's fetch;
# everything else the browser needs is either core or lives on the JS side.
common_web = [
    "pyodide-http",
]

# Local embedding on an NVIDIA GPU. `fastembed-gpu` is the same library under
# the same import name as `fastembed`, built against `onnxruntime-gpu` instead
# of `onnxruntime` --- the two therefore cannot be installed side by side,
# which is why this is its own extra rather than part of `common`. Swap the
# CPU package for it:
#
#     uv pip uninstall fastembed
#     uv pip install "kavalai[common,gpu]"
#
# No code or configuration changes: FastEmbed defaults to `cuda=Device.AUTO`
# and selects the CUDA execution provider when one is available, so
# `fastembed/<model>` keeps working and simply runs on the GPU. Force the
# choice by registering the provider with `cuda=True` / `device_ids=[…]`,
# which `FastEmbedClient` passes straight to FastEmbed.
#
# Unpinned on purpose, but check the card first: the current `onnxruntime-gpu`
# is a CUDA 13 build, and CUDA 13 dropped compute capability below 7.5 --- on a
# Pascal or Volta card it silently falls back to the CPU. Those need the CUDA 12
# build plus a cuDNN 9 that still has their kernels; `docs/tutorials/
# installation.rst` carries the verified combination.
gpu = [
    "fastembed-gpu",
]

# Test tooling. The suite exercises the real provider SDKs, servers and native
# deps, so it pulls in `common` rather than repeating that list.
test = [
    "kavalai[common]",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "python-dotenv",
    "testcontainers[postgres]",
]

# Sphinx, the theme, and the Jupyter kernel used to execute the notebooks.
docs = [
    "sphinx<9",
    "sphinx-immaterial",
    "myst-nb",
    "ipykernel>=7.3.0",
    "ipywidgets",
]

# The evaluation runner. `kavalai-eval <cases.yaml>` grades a running agent
# server; it is a thin wrapper over `kavalai.eval`, which needs no dependency
# the core install does not already have. `kavalai-skills` copies the bundled
# agent skills into a project.
[project.scripts]
kavalai-eval = "kavalai.eval.eval_runner:main"
kavalai-skills = "kavalai.skills:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kavalai*"]

[tool.setuptools.package-data]
"kavalai" = [
    # The agent skills ship inside the wheel, so an agent that reads an
    # installed package's `.agents` directory finds them with no install step.
    ".agents/skills/*/SKILL.md",
    ".agents/skills/*/references/*.md",
    "migrations/*/env.py",
    "migrations/*/script.py.mako",
    "migrations/*/versions/*.py",
    "demo_agents/**/*.yaml",
    "demo_agents/**/*.yml",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "examples"]
markers = [
    "integration: talks to a real provider or the internet; deselected by default, run with -m integration",
]
addopts = "-m 'not integration'"
pythonpath = ["."]

[tool.coverage.run]
source = ["kavalai"]

[tool.coverage.report]
show_missing = true
